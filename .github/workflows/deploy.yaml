name: Deploy to Cloudflare

# Only when something the site ships changes; preview-only commits are
# checked by ci.yaml but don't redeploy it.
on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy.yaml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Noto Sans CJK slices take minutes to download and build; the key
      # covers everything that decides their contents.
      - name: Cache Noto Sans CJK slices
        uses: actions/cache@v4
        with:
          path: packages/theme/generated
          key: noto-sans-${{ hashFiles('packages/theme/scripts/**') }}

      - name: Lint code
        run: pnpm lint

      - name: Build project
        run: pnpm --filter @planet/web build

      # After the build: it generates the gitignored routeTree.gen.ts the
      # app's types depend on.
      - name: Typecheck
        run: pnpm --filter "@planet/web..." typecheck

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy
