name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Noto Sans CJK slices take minutes to download and build; the key
      # covers everything that decides their contents.
      - name: Cache Noto Sans CJK slices
        uses: actions/cache@v4
        with:
          path: packages/theme/generated
          key: noto-sans-${{ hashFiles('packages/theme/scripts/**') }}

      - name: Lint code
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec oxfmt --check .

      - name: Build site and preview server
        run: pnpm build

      - name: Build static preview
        run: pnpm --filter @planet/preview build:static

      # After the builds: they generate the gitignored routeTree.gen.ts
      # files the apps' types depend on.
      - name: Typecheck
        run: pnpm typecheck
